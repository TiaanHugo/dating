@if (!memberService.editMode()){
@if (photos()) {
@if (photos().length > 0){
<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
     @for (photo of photos(); track photo.id){
     <div class="relative">
          <img src="{{photo.url}}"
               alt="Member Photo"
               class="w-full h-auto rounded-lg object-cover" />
          @if(accountService.currentUser()?.id === memberService.member()?.id){
          <app-favourite-button [selected]="photo.url === memberService.member()?.imageUrl"
                                [disabled]="photo.url === memberService.member()?.imageUrl"
                                (clickEvent)="setMainPhoto(photo)"
                                class="absolute top-1 right-1"></app-favourite-button>

          <app-delete-button [disabled]="photo.url === memberService.member()?.imageUrl"
                             (clickEvent)="deletePhoto(photo)"
                             class="absolute top-1 left-1"></app-delete-button>
          }

     </div>
     }

</div>
} @else {
<p class="text-center text-gray-500">No photos available.</p>
}
}
} @else {
<app-image-upload (uploadFile)="onUploadImage($event)"
                  [loading]="loading()"></app-image-upload>
}
