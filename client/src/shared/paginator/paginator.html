<div class="flex items-center w-full gap-3 py-3">
    <span>Items per page:</span>
    <select class="select w-24" [value]="pageSize()" (change)="onPageChange(undefined, $event.target)">
        @for (size of pageSizeOptions(); track size) {
            <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
        }
    </select>

    <div class="text-sm">
        {{(pageNumber() -1 ) * pageSize() + 1}} - {{lastItemIndex()}} of {{totalCount()}}
    </div>

    <div class="flex items-center gap-2">
        <button class="btn btn-circle btn-ghost" [disabled]="pageNumber() === 1" (click)="onPageChange(pageNumber() - 1)">
            <i class="fa-solid fa-chevron-left"></i>
            &larr;
        </button>

        <button class="btn btn-circle btn-ghost" [disabled]="pageNumber() >= totalPages()" (click)="onPageChange(pageNumber() + 1)">
            <i class="fa-solid fa-chevron-right"></i>
            &rarr;
        </button>
    </div>
    
</div>
